schema_version: 1

context:
  name: plotastro
  version: "1.1.1"

package:
  name: plotastro
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: ece37faf4c9b502af729bfb3ce4c75713581561913a091c1d7c432ec355f6e2a

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - plotastro-authors = plotastro._authors:main

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - matplotlib-base >=3.5
    - numpy

tests:
  - python:
      imports:
        - plotastro
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - files:
      source:
        - tests/
        - docs/api/
        - examples/authors_example.csv
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
        - cmasher
    script:
      - plotastro-authors --help
      - pytest tests -v

about:
  homepage: https://github.com/BehnoodBandi/plotastro
  summary: Publication-quality matplotlib styles and helpers for astronomy, physics and chemistry journals
  description: |
    plotastro provides matplotlib style sheets and helpers for producing
    publication-ready figures for astronomy, physics and chemistry journals
    (MNRAS, A&A, ApJ, OJA, the Physical Review journals, JCAP, Nature
    Astronomy, and the RSC and ACS journals): journal-accurate figure sizes,
    fonts and colorblind-friendly palettes, plus a tool that generates LaTeX
    author/affiliation blocks from a CSV file.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/BehnoodBandi/plotastro
  documentation: https://plotastro.readthedocs.io/

extra:
  recipe-maintainers:
    - BehnoodBandi
